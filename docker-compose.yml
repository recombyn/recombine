services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.web
    ports:
      - "3000:80"
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.api
      args:
        INSTALL_OCR: "${INSTALL_OCR:-false}"
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api/storage/uploads:/app/apps/api/storage/uploads
      - ./apps/api/storage/results:/app/apps/api/storage/results
    environment:
      - LIBREOFFICE_PATH=/usr/bin/soffice
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - USE_VISION=${USE_VISION:-true}
      - IMPORT_DPI=${IMPORT_DPI:-200}
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.api
      args:
        INSTALL_OCR: "${INSTALL_OCR:-false}"
    command: celery -A worker.celery_app.celery worker -l info --concurrency=1
    volumes:
      - ./apps/api/storage/uploads:/app/apps/api/storage/uploads
      - ./apps/api/storage/results:/app/apps/api/storage/results
    environment:
      - LIBREOFFICE_PATH=/usr/bin/soffice
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - USE_VISION=${USE_VISION:-true}
      - IMPORT_DPI=${IMPORT_DPI:-200}
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  redis_data:

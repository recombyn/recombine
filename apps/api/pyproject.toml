[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recombyn-api"
version = "0.1.0"
description = "Recombyn API — canvas Scene + Design Agent runtime"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "python-multipart>=0.0.12",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "sqlmodel>=0.0.22",
  "alembic>=1.14.0",
  "pdfplumber>=0.11.0",
  "celery[redis]>=5.4.0",
  "redis>=5.0.0",
  "pdf2image>=1.17.0",
  "python-docx>=1.1.0",
  "httpx>=0.27.0",
  "google-auth>=2.35.0",
  "pymysql>=1.1.0",
  "boto3>=1.35.0",
  "Pillow>=10.0.0",
  "zstandard>=0.22.0",
  "svg.path>=6.3",
  "langgraph>=0.4.0",
  "langgraph-checkpoint-mysql[pymysql]>=2.0.0",
  "langgraph-checkpoint-sqlite>=2.0.0",
  "langchain>=0.3.0",
  "langchain-core>=0.3.0",
  "langchain-openai>=1.0.0",
  "langchain-text-splitters>=0.3.0",
  "langfuse>=3.0.0",
  "cryptography>=42.0.0",
  "geoip2>=4.8.0",
]

[project.optional-dependencies]
ocr = [
  "opencv-python-headless>=4.10.0",
  "numpy>=1.26.0",
  "paddleocr>=2.9.0",
]
# PaddlePaddle wheel is platform-specific; install separately, e.g.:
#   pip install paddlepaddle -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
# On paddle 3.3.x + CPU, OCR init uses enable_mkldnn=False to avoid the known
# oneDNN/PIR ConvertPirAttribute crash (or pin paddlepaddle==3.2.2).
vision = [
  "opencv-python-headless>=4.10.0",
  "numpy>=1.26.0",
  "paddleocr>=2.9.0",
  "Pillow>=10.0.0",
  "rembg[cpu]>=2.0.50",
]
storage = ["boto3>=1.35.0"]
# OpenCLIP aesthetics RAG (quality samples → MySQL BLOB vectors)
aesthetics = [
  "numpy>=1.26.0",
  "torch>=2.2.0",
  "open-clip-torch>=2.24.0",
]
postgres = [
  "psycopg[binary]>=3.1.0",
]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "pytest-xdist>=3.5.0",
  "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
  "integration: HTTP / service integration tests",
  "unit: fast isolated unit tests",
]

[tool.coverage.run]
source = ["app", "worker"]
omit = ["tests/*", "app/alembic/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
